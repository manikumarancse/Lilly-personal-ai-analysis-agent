<!doctype html><html><head><meta charset="utf-8"><title>Lilly</title><link rel="stylesheet" href="popup.css"></head><body><main>
<div class="brand"><div class="logo">L</div><div><h1>Lilly</h1><p>Live chart monitor</p></div></div><div id="connection" class="status offline">Checking Lilly…</div>
<section><span class="label">Current tab</span><strong id="tabTitle">Loading…</strong><small id="tabUrl"></small></section>
<section><span class="label">Automatic live price</span><strong id="livePrice">Waiting</strong><small id="liveHint">Select a TradingView tab to start.</small></section>
<button id="watch">Watch This Tab + Start Live Monitor</button><button id="capture">Capture Chart Now</button><button id="stop" class="secondary">Stop Watching</button>
<section class="taskbox"><span class="label">Add chart condition</span><select id="kind"><option value="price_above">Price reaches / goes above</option><option value="price_below">Price reaches / goes below</option></select><input id="level" type="number" step="any" placeholder="Price level"><input id="label" type="text" maxlength="160" placeholder="Optional note"><button id="addTask">Add Watch Task</button></section>
<button id="getUpdate" class="secondary">What's the update?</button><button id="analyzeSession" class="secondary">Analyze Current Session</button><button id="resetSession" class="secondary">Start New Session</button>
<section id="updateBox" style="display:none"><span class="label">Lilly update</span><div id="updateText"></div></section><section id="analysisBox" style="display:none"><span class="label">Lilly analysis</span><div id="analysisText"></div></section>
<section><span class="label">Active / recent tasks</span><div id="tasks">No tasks yet.</div></section><p id="message" class="message"></p></main><script src="popup.js"></script></body></html>
